kind = "web"
previewPath = "/"
title = "NexusChat"
description = "A mobile-friendly messaging app with email and password sign-in, registered contacts, and Firebase-backed conversations."
version = "1.0.0"
id = "artifacts/nexuschat"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21030

[services.development]
run = "pnpm --filter @workspace/nexuschat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nexuschat", "run", "build" ]
serve = "static"
publicDir = "artifacts/nexuschat/dist"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21030"
BASE_PATH = "/"
